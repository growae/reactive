[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ae-core"
version = "0.1.0"
description = "aeternity protocol primitives — transaction serialisation, addresses and signing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/growae/reactive"

[tool.maturin]
python-source = "python"
module-name = "ae_core._ae_core"
features = ["pyo3/extension-module"]
