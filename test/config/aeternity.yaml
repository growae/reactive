---
fork_management:
  network_id: ae_devnet

# Dev mode with on-demand consensus: blocks are produced when there is something
# to put in them, with no proof of work. The previous config mined with cuckoo
# `mean15-generic`, which meant the suite waited on real PoW for every block and
# did not run at all on hosts where that prebuilt miner cannot execute.
system:
  dev_mode: true

chain:
  persist: false
  consensus:
    "0":
      type: on_demand

dev_mode:
  auto_emit_microblocks: true

http:
  external:
    port: 3013
  internal:
    port: 3113

websocket:
  channel:
    port: 3014
