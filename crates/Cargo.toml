[workspace]
resolver = "2"
members = ["reactive-core"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/growae/reactive"
publish = false

[workspace.dependencies]
bs58 = "0.5"
base64 = "0.22"
blake2 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
num-bigint = "0.4"
thiserror = "2"
hex = "0.4"
serde_json = "1"
