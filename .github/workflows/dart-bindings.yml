name: Dart bindings

# `agent/**` so a feature branch gates itself before a pull request exists —
# full reasoning, including why the duplicate run while a PR is open is
# deliberate, in ci.yml.
on:
  push:
    branches: [main, develop, 'agent/**']
    paths:
      - 'bindings/dart/**'
      - 'crates/ae-core/**'
      - '.github/workflows/dart-bindings.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'bindings/dart/**'
      - 'crates/ae-core/**'
      - '.github/workflows/dart-bindings.yml'

permissions:
  contents: read

# The two binaries the Check job's codegen step needs, pinned in one place so
# the cache key below and the installs are the same string by construction —
# a key that could drift from its pin would serve a stale binary, which is the
# one failure the pin exists to prevent.
env:
  # The exact patch that produced the committed glue (the version baked into
  # every `frb_generated.*` header). A floating install would silently rewrite
  # that version string on every run and turn an unrelated PR into a large,
  # unreviewed diff.
  FRB_CODEGEN_VERSION: '2.13.0'
  # `flutter_rust_bridge_codegen generate` shells out to `cargo expand` and,
  # finding none, installs the latest itself mid-step — so this tool was
  # already in the gate, unpinned and invisible, compiled from source on every
  # cache miss. Naming it here pins it and makes it cacheable.
  CARGO_EXPAND_VERSION: '1.0.126'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v7

      # Pinned to match python-bindings.yml, same reasoning: a floating
      # toolchain turns an unrelated Rust release into a red gate on an
      # untouched branch.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      # `cache-bin: false` on this job only. The default caches
      # `~/.cargo/bin` under a key derived from Cargo.lock and the rustc
      # version, which made the two pinned tools below survive by accident and
      # vanish on any lockfile bump. The version-keyed cache below owns them
      # instead; leaving both on would double-store ~30MB and let a
      # prefix-matched restore put a wrong-version binary on PATH.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/dart/rust
          cache-bin: false

      - run: cargo fmt --all -- --check
        working-directory: bindings/dart/rust

      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: bindings/dart/rust

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --enforce-lockfile

      # `cargo install` compiles from source: measured at 1m25s for the
      # codegen tool, plus a further ~1m11s hidden inside the generate step
      # below, which auto-installs `cargo-expand` when it cannot find one.
      # Keyed on the two pinned versions and nothing else, so this is a hit on
      # every run until a pin moves, and moving a pin can never serve the old
      # binary. Deliberately no `restore-keys`: a prefix match would do
      # precisely that.
      - name: Restore the pinned codegen tools
        id: codegen-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: codegen-tools-${{ runner.os }}-frb-${{ env.FRB_CODEGEN_VERSION }}-expand-${{ env.CARGO_EXPAND_VERSION }}

      - name: Install the pinned codegen tools
        if: steps.codegen-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked flutter_rust_bridge_codegen@"$FRB_CODEGEN_VERSION"
          cargo install --locked cargo-expand@"$CARGO_EXPAND_VERSION"

      # Guards the cache: a hit that restored a truncated or non-executable
      # binary would otherwise surface as a confusing codegen failure two
      # steps later, and a silently wrong `cargo-expand` would let the
      # generate step below quietly install its own again.
      - name: Verify the codegen tools on PATH
        # In the crate dir, not `bindings/dart`: `cargo expand` is invoked as a
        # cargo subcommand and wants a manifest, and this is the same directory
        # the generate step below runs it from.
        working-directory: bindings/dart/rust
        run: |
          set -euo pipefail
          flutter_rust_bridge_codegen --version
          cargo expand --version

      - run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      # `dart pub get` above is load-bearing here, not just for `dart
      # analyze`: without a resolved `.dart_tool/package_config.json`,
      # `dart format` can't see this package's language version and falls
      # back to the newest formatting style, which reformats every generated
      # file and makes this check fail on every run regardless of drift.
      #
      # `git status --porcelain --untracked-files=all` rather than `git
      # diff`: a signature added to `api/core.rs` can add a wholly new
      # generated file, which a diff against tracked paths would miss.
      - name: Fail on drift in the generated Dart/Rust glue
        run: |
          git status --porcelain --untracked-files=all \
            -- lib/src/rust/ \
               rust/src/frb_generated.rs \
            > /tmp/drift
          if [ -s /tmp/drift ]; then
            echo "bindings/dart's generated glue differs from a fresh 'flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml' — re-run codegen and commit the result:"
            cat /tmp/drift
            exit 1
          fi

      - run: dart analyze --fatal-infos

  build:
    name: Build
    needs: check
    # A packaging check, not a compile gate — Test already builds the Linux
    # native library, so a branch that cannot compile goes red without this.
    # Keep it off intermediate pushes, same reasoning as python-bindings.yml.
    if: github.event_name == 'pull_request' || github.ref_name == 'develop' || github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: ''
          - os: macos-latest
            name: macos-arm64
            target: ''
          # No `macos-13` (Intel) runner ever gets scheduled by GitHub — see
          # the workflow file's own history for the queued-until-24h-cancel
          # symptom. `macos-latest` is arm64, so the x86_64 dylib is
          # cross-compiled from there, same fix python-bindings.yml already
          # applies to its wheel matrix.
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/dart/rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/dart/rust

      - name: Build
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked
          fi

      - name: Resolve output directory
        id: outdir
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            echo "dir=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=target/release" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ae-core-dart-${{ matrix.name }}
          path: |
            bindings/dart/rust/${{ steps.outdir.outputs.dir }}/*.so
            bindings/dart/rust/${{ steps.outdir.outputs.dir }}/*.dylib
          if-no-files-found: ignore

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/dart/rust

      - run: cargo build --release --locked
        working-directory: bindings/dart/rust

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --enforce-lockfile

      - run: dart test
