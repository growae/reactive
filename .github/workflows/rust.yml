name: Rust

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: crates

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to a minor rather than `stable`: clippy's lint set changes with
      # the minor, and the crate denies warnings below, so a floating toolchain
      # turns an unrelated Rust release into a red gate on an untouched branch.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked
