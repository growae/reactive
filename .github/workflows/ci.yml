name: CI

# `agent/**` is on `push` so a feature branch gates itself before a pull
# request exists. Without it a branch gets no CI from either trigger — the
# `pull_request` filter matches the BASE branch, so it fires only once a PR is
# open — and work arrives at review with nothing to point at but a local run on
# the author's own host.
#
# While a PR is open both triggers fire on the same commit, and that duplicate
# is deliberate. The usual fix, a `concurrency` group with
# `cancel-in-progress`, collapses them by cancelling one — and a cancelled
# check on a pull request reads as not-green to whoever is holding the merge
# gate. A run too many is cheaper than a verdict that has to be explained.
# Actions minutes are free on this repository, so the cost here is wall-clock
# and noise, not money.
#
# The release workflows are deliberately not in this list: `release.yml` is
# `push` to `main` and `release-branch.yml` is `workflow_dispatch`. Neither is
# a gate and neither should ever fire from a feature branch.
on:
  push:
    branches: [main, develop, 'agent/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm check:types

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  coverage-badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Generate badge
        uses: jaywcjlove/coverage-badges-cli@v2.2.0
        with:
          source: coverage/coverage-summary.json
          output: coverage/badge.svg
      - name: Deploy badge to wiki
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
          destination_dir: coverage
          publish_branch: gh-pages

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # A standing gate, not an opt-in. Every pull request into `develop` or
    # `main`, and every push to those two branches.
    #
    # The `integration` label is gone. Once the job is unconditional on pull
    # requests a label can only ever select which pull requests SKIP the gate,
    # and `pull_request` here carries no `types:`, so `labeled` never fires and
    # a label added to an already-open pull request would not have started the
    # job anyway. It was an opt-in wearing the costume of a gate.
    #
    # Nothing is excluded by author or by path. A dependency-only pull request
    # is not a cheap one to skip — a batched `pnpm-lock.yaml` sweep rewires
    # every transitive JS dependency at once and is the change most likely to
    # break against the devnet, so any filter keyed on "it only touched the
    # lockfile" goes green exactly where the gate earns its keep. The job costs
    # ~70s and Actions minutes are free on this repository; that is not a price
    # worth buying a blind spot with.
    #
    # `push` to the two integration branches is included deliberately. Merges
    # into `develop` are made locally with `--no-ff`, so whenever `develop`
    # moved under a branch the merge commit is a tree no pull request ever
    # tested. Without this, "CI is green on `develop`" says nothing at all
    # about integration — which is the one claim a release candidate needs it
    # to make.
    #
    # `agent/**` pushes stay excluded: this is a merge gate, and a branch with
    # no pull request open is not yet asking to merge.
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/heads/main'
    needs: build
    timeout-minutes: 15
    # The devnet is started from docker-compose.yml, not as a `services:`
    # container. A service container is created before the first step runs, so
    # `actions/checkout` has not yet put test/config/aeternity.yaml on the
    # runner when its bind mount is resolved — Docker then creates an empty
    # directory at the mount target and the node silently boots ae_mainnet
    # instead of the ae_devnet the suite pins. That failure is silent: the node
    # is healthy and answers /v3/status, it is just the wrong chain.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start devnet
        run: docker compose up -d --wait
      - run: pnpm test:integration
      - name: Stop devnet
        if: always()
        run: docker compose down -v
