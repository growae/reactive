name: WASM bindings

on:
  push:
    branches: [main, develop]
    paths:
      - 'bindings/wasm-js/**'
      - '.github/workflows/wasm-bindings.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'bindings/wasm-js/**'
      - '.github/workflows/wasm-bindings.yml'

permissions:
  contents: read

jobs:
  wasm-bindings:
    name: WASM bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust.yml's toolchain rather than left floating.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm-js/placeholder-core

      - run: cargo install --locked cargo-component@0.21.1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @growae/reactive-wasm-js-binding run build

      # The transpiled output is committed so the differential harness (and
      # this directory's own test) can load it without a Rust toolchain.
      # Rebuilding here and diffing against the committed copy is what makes
      # that convention enforced rather than trusted.
      #
      # `git diff` alone would miss an ADDED output file: build:js does
      # `rm -rf generated` first, so a jco run that emits something new (a
      # second core module once the world grows past one) leaves it untracked
      # and invisible to a diff. `git status --porcelain` sees all three
      # cases — modified, deleted and added.
      - name: Fail on committed-artifact drift
        run: |
          git status --porcelain --untracked-files=all bindings/wasm-js/generated/ > /tmp/drift
          if [ -s /tmp/drift ]; then
            echo "generated/ differs from a fresh build — regenerate with 'pnpm build' in bindings/wasm-js and commit:"
            cat /tmp/drift
            exit 1
          fi
